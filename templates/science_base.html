<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - JADES Labs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: {{ accent_color }};
            --accent-soft: {{ accent_soft }};
        }
        body {
            background: white;
            color: #222;
            padding-bottom: 60px;
        }
        .hero {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 100%);
            color: white;
            padding: 60px 0 50px 0;
            margin-bottom: 40px;
        }
        .hero .eyebrow {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 600;
        }
        .back-link {
            color: white;
            opacity: 0.9;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            opacity: 1;
            color: white;
            text-decoration: underline;
        }
        .content-section {
            max-width: 860px;
            margin: 0 auto 40px auto;
        }
        .content-section h2 {
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 18px;
            margin-top: 10px;
        }
        .content-section h3 {
            color: #333;
            font-weight: 700;
            margin-top: 24px;
            margin-bottom: 12px;
            font-size: 1.15rem;
        }
        .content-section p, .content-section li {
            font-size: 1.05rem;
            line-height: 1.75;
            color: #333;
        }
        .callout {
            background: var(--accent-soft);
            border-left: 5px solid var(--accent);
            border-radius: 8px;
            padding: 20px 25px;
            margin: 25px 0;
        }
        .callout h3 {
            margin-top: 0;
            color: var(--accent);
        }
        .step-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 18px;
            border: 1px solid #eee;
        }
        .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .launch-cta {
            text-align: center;
            margin: 50px auto 20px auto;
            max-width: 860px;
        }
        .btn-launch-big {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px 45px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .btn-launch-big:hover {
            transform: scale(1.05);
            color: white;
            filter: brightness(1.1);
        }
        .glossary dt {
            color: var(--accent);
            font-weight: 700;
            margin-top: 10px;
        }
        .glossary dd {
            margin-bottom: 8px;
            color: #333;
        }
        figure.diagram {
            text-align: center;
            margin: 30px 0;
        }
        figure.diagram figcaption {
            font-size: 0.9rem;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="container">
            <a href="{{ url_for('index') }}" class="back-link">&larr; Back to JADES Labs</a>
            <p class="eyebrow mt-4 mb-1">{{ eyebrow }}</p>
            <h1 class="display-5 fw-bold mb-3">{{ page_title }}</h1>
            <p class="fs-5 mb-0" style="max-width: 760px; opacity: 0.95;">{{ page_subtitle }}</p>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}

        <div class="launch-cta">
            <a href="{{ lab_url }}" target="_blank" class="btn btn-launch-big">Try the {{ lab_short_name }} yourself &rarr;</a>
        </div>
    </div>
</body>
</html>
